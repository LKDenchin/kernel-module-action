name: Build Kmod for Xiaomi 15 (ARM64)

on: [push]

env:
  # 强制使用 Node.js 24 适配 2026 规范
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libelf-dev libssl-dev bison flex

      - name: Set up Android Clang
        # 下载 Android NDK 预构建的 Clang 编译器
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522830.tar.gz
          tar -xzf clang-r522830.tar.gz

      - name: Get Android GKI Headers
        # 小米15 通常使用 android15-6.6 或类似内核
        # 建议先在手机上执行 uname -r 确认版本，此处以 6.6 为例
        run: |
          git clone --depth 1 https://android.googlesource.com/kernel/common -b android15-6.6 $GITHUB_WORKSPACE/kernel-source

      - name: Build Module
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          # 关键参数：使用 LLVM 编译，指定架构为 arm64
          make -C $GITHUB_WORKSPACE/kernel-source \
               M=$GITHUB_WORKSPACE \
               ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-gnu- \
               LLVM=1 \
               LLVM_IAS=1 \
               modules

      - name: Upload .ko
        uses: actions/upload-artifact@v4
        with:
          name: tcp_pixie_xiaomi15
          path: ./*.ko
