name: Build Kmod for Xiaomi 15

on: [push]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 小米15 对应的内核版本分支
  GKI_VERSION: android15-6.6

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libelf-dev libssl-dev bison flex llvm lld clang

      - name: Download Android Kernel Headers
        # 直接拉取 GKI 的完整内核源码树（最稳妥，防止缺少头文件）
        run: |
          git clone --depth 1 https://android.googlesource.com/kernel/common -b ${{ env.GKI_VERSION }} $GITHUB_WORKSPACE/kernel-source

      - name: Build Module
        run: |
          cd $GITHUB_WORKSPACE
          # 使用系统自带的 Clang，但指定 ARM64 目标
          # 小米15 是骁龙8 Elite，必须开启 LLVM 编译
          make -C $GITHUB_WORKSPACE/kernel-source \
               M=$GITHUB_WORKSPACE \
               ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-gnu- \
               LLVM=1 \
               LLVM_IAS=1 \
               modules

      - name: Check Artifact
        # 在上传前先检查一下生成的 ko 是否真的是 ARM64 格式
        run: |
          KO_FILE=$(find . -name "*.ko")
          echo "Checking $KO_FILE"
          file $KO_FILE

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcp_pixie_xiaomi15
          path: ./*.ko
