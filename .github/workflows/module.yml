name: Build Kernel Module

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 设置环境变量以适配 2026 年的 Node.js 24 要求
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build on Ubuntu 22.04
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-$(uname -r)

      - name: Build the kernel module
        run: make

      - name: Rename and Prepare Artifact
        # 使用 find 命令自动抓取生成的 .ko 文件，避免手动写错名字
        # 它会将 xxx.ko 重命名为 xxx_ubuntu-22.04.ko
        run: |
          KO_FILE=$(find . -maxdepth 1 -name "*.ko" -print -quit)
          if [ -z "$KO_FILE" ]; then
            echo "Error: No .ko file found after make!"
            exit 1
          fi
          NEW_NAME="${KO_FILE%.ko}_ubuntu-22.04.ko"
          mv "$KO_FILE" "$NEW_NAME"
          echo "FINAL_KO=$NEW_NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kmod-ubuntu-22.04
          # 使用上面步骤保存的环境变量
          path: ${{ env.FINAL_KO }}
          retention-days: 7
