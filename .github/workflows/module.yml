name: Build Kmod for Xiaomi 15

on: [push]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GKI_VERSION: android15-6.6 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libelf-dev libssl-dev bison flex llvm lld clang gcc-aarch64-linux-gnu

      - name: Download Android Kernel Headers
        run: |
          git clone --depth 1 https://android.googlesource.com/kernel/common -b ${{ env.GKI_VERSION }} $GITHUB_WORKSPACE/kernel-source

      - name: Configure and Prepare Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel-source
          # 使用 GKI 默认配置
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 gki_defconfig
          
          # 关键修复：生成 Module.symvers 和必要的脚本
          # 这会处理内核自带的模块，从而生成我们要链接的符号表
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 modules_prepare

      - name: Build Module
        run: |
          # 加上 KBUILD_MODPOST_WARN=1 可以让它在符号缺失时只警告不报错（虽然加载时可能仍有问题，但能出产物）
          # 但最稳妥的是加上 KERNELRELEASE 变量
          cd $GITHUB_WORKSPACE
          make -C $GITHUB_WORKSPACE/kernel-source \
               M=$GITHUB_WORKSPACE \
               ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-gnu- \
               LLVM=1 \
               LLVM_IAS=1 \
               KBUILD_MODPOST_WARN=1 \
               modules

      - name: Check Artifact
        run: |
          KO_FILE=$(find . -maxdepth 1 -name "*.ko")
          if [ -z "$KO_FILE" ]; then exit 1; fi
          modinfo $KO_FILE

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcp_pixie_xiaomi15
          path: ./*.ko
