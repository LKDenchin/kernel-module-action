name: Build Kmod for Xiaomi 15

on: [push]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GKI_VERSION: android15-6.6 # 小米15 对应的内核分支

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libelf-dev libssl-dev bison flex llvm lld clang gcc-aarch64-linux-gnu

      - name: Download Android Kernel Headers
        run: |
          git clone --depth 1 https://android.googlesource.com/kernel/common -b ${{ env.GKI_VERSION }} $GITHUB_WORKSPACE/kernel-source

      - name: Configure Kernel
        # 这是修复问题的核心步骤
        run: |
          cd $GITHUB_WORKSPACE/kernel-source
          # 1. 生成 GKI 默认配置
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 gki_defconfig
          # 2. 准备编译模块所需的头文件和脚本
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 modules_prepare

      - name: Build Module
        run: |
          # 编译你的 tcp_pixie.ko
          make -C $GITHUB_WORKSPACE/kernel-source \
               M=$GITHUB_WORKSPACE \
               ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-gnu- \
               LLVM=1 \
               LLVM_IAS=1 \
               modules

      - name: Check Artifact
        run: |
          KO_FILE=$(find . -maxdepth 1 -name "*.ko")
          if [ -z "$KO_FILE" ]; then echo "No .ko found"; exit 1; fi
          file $KO_FILE
          # 打印 vermagic 看看是否匹配
          modinfo $KO_FILE | grep vermagic

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcp_pixie_xiaomi15
          path: ./*.ko
